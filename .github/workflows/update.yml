name: Update policy databases

on:
  schedule:
    - cron: "20 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Update PBOC
        run: python -m china_policy_db update pboc
      - name: Update gov.cn policy
        run: python -m china_policy_db update gov-policy --request-delay-seconds 1.5
      - name: Validate
        run: python -m china_policy_db validate
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update parsed policy databases"
            git push
          fi
