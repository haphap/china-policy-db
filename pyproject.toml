[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "china-policy-db"
version = "0.1.0"
description = "Parsed PBOC open-market and gov.cn China policy document databases"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.4",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
china-policy-db = "china_policy_db.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
